<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Jersey+20&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libre+Baskerville:ital@1&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<title>Artist Game</title>
<style>
  
    body {
       
    margin: 0;
    font-family: Arial, sans-serif;
    background: url("./gameBackground3.gif") no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: "Jersey 20", sans-serif;

  
    }

    .container {
        background: #fff0f6;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        text-align: center;
        width: 320px;
        animation: popIn 0.6s ease;
         border: 3px solid #ff4fa3;
    box-shadow: 0 0 15px #ff4fa3, 0 0 5px #fff;
     
    }

    h1 {
        color: #ff4fa3;
        margin-bottom: 20px;
        animation: float 2s infinite ease-in-out;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 10px;
        border: 2px solid #ff9ad5;
        outline: none;
        font-size: 14px;
        transition: transform 0.2s;
    }

    input:focus {
        transform: scale(1.15);
    }

    button {
        background: #ff4fa3;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 15px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
        transition: transform 0.2s, background 0.3s;
        font-family: "Jersey 20", sans-serif;
    }

    button:hover {
        background: #ff2f8c;
        transform: scale(1.25);
        font-family: "Jersey 20", sans-serif;

    }

    button:active {
        transform: scale(0.95);
    }
.output {
    margin-top: 20px;
    background: #ffe3f1;
    padding: 15px;
    border-radius: 15px;
    color: #d63384;
    min-height: 40px;
    opacity: 0;
    transform: scale(0.5);
    font-size: 25px;
}

    .show {
        animation: popAndFade 5s forwards
    }

   
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

  
    @keyframes popIn {
        0% {
            transform: scale(0.74);
            opacity: 1;
        }
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }


  @keyframes popBounce {
    0% {
        transform: scale(0.3);
        opacity: 0;
    }
    60% {
        transform: scale(1.1);
        opacity: 1;
    }
    80% {
        transform: scale(0.95);
    }
    100% {
        transform: scale(1);
    }
}
    
    
  
  .output.show {
    animation: popBounce 8.0s ease forwards;
    border: 3px solid #ff4fa3;
    box-shadow: 0 0 15px #ff4fa3, 0 0 5px #fff;
  }
    
</style>
</head>
<body>

<div class="container">
    <h1>🤔  Who is your favorite artist?</h1>
    
    <input type="text" id="artist" placeholder="Enter your favorite artist's name">
    <input type="number" id="age" placeholder="Enter their age">
    
    <button onclick="showData()">Play</button>

    <div class="output" id="outputBox"></div>
</div>

<script>

   

function showData() {
    let artist = document.getElementById("artist").value;
    let age = document.getElementById("age").value;
    let output = document.getElementById("outputBox");

    if (artist === "" || age === "") {
        output.innerHTML = "⚠️ Please fill out all fields!";
        output.classList.add("show");
        return;
    }

age = Number(age);

    if (age < 25) {
        output.innerHTML = "Artist Name: " + artist+ "<br>" + artist + " is " + age + " years old" + "<br>" + "They’re younger than Google.";
    } 
    else if (age === 25) {
        output.innerHTML = "They’re " + age + " years old and they’re as old as Google.";
    } 
    else {
        output.innerHTML = "They’re " + age + " years old and they’re older than Google.";
    }
output.classList.remove("show");
    void output.offsetWidth; // forces reflow
    output.classList.add("show");
    
  
}


</script>

</body>
</html>
